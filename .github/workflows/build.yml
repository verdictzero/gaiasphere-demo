# Builds the Windows and Linux executables and the Android APK and attaches them to a release.
#
#   push to the release branch -> a release <config/version> (project.godot's)
#                                 with both zips; bump the version to make another
#   push a tag v<something>    -> a release of that name
#   run it by hand (Actions)   -> the builds as a workflow artifact; tick `release`
#                                 to publish <config/version> from that branch too
name: Build

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a release named <config/version>"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The engine the project is made with, as godotengine/godot-builds tags it.
  GODOT_VERSION: "4.7-dev5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Godot, cached
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-all-v1

      - name: Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION"
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          if [ ! -x ~/godot-bin/godot ]; then
            mkdir -p ~/godot-bin
            curl -fsSL -o "$RUNNER_TEMP/$zip" "$base/$zip"
            curl -fsSL -o "$RUNNER_TEMP/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"
            ( cd "$RUNNER_TEMP" && grep " $zip\$" SHA512-SUMS.txt | sha512sum -c - )
            unzip -q -o "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
            mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-bin/godot
          fi
          sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot
          godot --version

      - name: Build
        run: tools/build.sh all

      - name: Keep the zips
        uses: actions/upload-artifact@v4
        with:
          name: VES27
          path: |
            build/VES27_*.zip
            build/VES27_android.apk

      - name: Release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="$GITHUB_REF_NAME"
          else
            name="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot | head -1)"
          fi
          if gh release view "$name" >/dev/null 2>&1; then
            echo "::error::$name is already released. Bump config/version in project.godot and push again."
            exit 1
          fi
          gh release create "$name" build/VES27_windows.zip build/VES27_linux.zip build/VES27_android.apk \
            --target "$GITHUB_SHA" \
            --title "Virtual Emulator Simulator 27 $name" \
            --notes "Windows and Linux: unzip and run. Android: an arm64 APK to sideload; it installs over the last one (same key, a higher version code). The island is baked into the build. Controls are in the README."
